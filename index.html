<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Valåret</title>
<style>
:root{
  --bg:#11151B; --bg2:#1A2029;
  --kort:#F6F3ED; --ink:#161A20; --dim:#8A93A0; --dim2:#5A6472;
  --guld:#D9A441; --pos:#57A183; --neg:#C4584F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#11151B;height:100%}
.bakgrund{position:fixed;inset:0;background:#11151B;z-index:-1}
html,body{margin:0}
body{overflow-x:hidden}
body{background:var(--bg);color:var(--kort);min-height:100dvh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  user-select:none;touch-action:none}
.scen{width:100%;max-width:420px;min-height:100dvh;margin:auto 0;
  display:flex;flex-direction:column;gap:22px;padding:20px 18px 24px}
/* Korta skärmar: dra ihop luften istället för att skjuta kortet utanför bild */
@media (max-height:680px){
  .scen{gap:14px;padding:14px 16px 18px}
  .valrad{min-height:96px}
  .yta{min-height:200px}
  .kort{padding:20px 20px}
  .kort h2{font-size:18px}
  .kort .dragtip{margin-top:16px}
  .info{padding-top:12px;margin-top:12px}
  .mål{margin-top:10px}
}

/* Mätare */
.topp{display:flex;gap:10px}
.gauge{flex:1;text-align:center;position:relative}
.gauge .namn{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--dim);margin-bottom:8px;font-weight:600}
.gauge .spår{height:14px;background:#2B3542;border:1px solid #3A4655;border-radius:7px;
  position:relative;overflow:hidden}
.gauge .spår i{position:absolute;top:0;bottom:0;background:#7E8898;
  transition:left .4s cubic-bezier(.2,.7,.3,1),width .4s cubic-bezier(.2,.7,.3,1),background .3s}
.gauge .spår i.upp{background:var(--pos)}
.gauge .spår i.ned{background:var(--neg)}
.gauge.fara .spår{border-color:var(--neg)}
.gauge .namn,.gauge .spår{transition:color .15s,border-color .15s,box-shadow .15s}
.gauge.berörd .namn{color:var(--kort)}
.gauge.berörd .spår{border-color:var(--kort);box-shadow:0 0 0 2px rgba(246,243,237,.18)}
.gauge .mitt{position:absolute;left:50%;top:0;bottom:0;width:2px;
  background:#0E1319;margin-left:-1px}
.gauge .v{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;
  margin-top:7px;color:var(--dim2);transition:color .3s}
.gauge .v.upp{color:var(--pos)} .gauge .v.ned{color:var(--neg)}

/* Respons direkt efter ett beslut */
.flyt{position:absolute;left:0;right:0;top:-15px;font-size:14px;font-weight:700;
  font-variant-numeric:tabular-nums;pointer-events:none;color:var(--pos);
  text-shadow:0 1px 3px var(--bg)}
.flyt.ned{color:var(--neg)}
.gauge.puls .spår{animation:puls .55s ease-out}
@media (prefers-reduced-motion:no-preference){
  .flyt{animation:stig 1.1s cubic-bezier(.2,.7,.3,1) forwards}
}
@media (prefers-reduced-motion:reduce){ .flyt{opacity:0} }
@keyframes stig{
  0%{transform:translateY(6px);opacity:0}
  18%{transform:translateY(0);opacity:1}
  70%{opacity:1}
  100%{transform:translateY(-20px);opacity:0}
}
@keyframes puls{
  0%{transform:scaleY(1)}
  35%{transform:scaleY(1.55)}
  100%{transform:scaleY(1)}
}
.efter{width:100%;transition:opacity .12s}
.efter.ny .txt{animation:in .3s ease-out}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.info{display:flex;justify-content:space-between;align-items:flex-end;
  padding-top:18px;margin-top:18px;border-top:1px solid #232B36;font-variant-numeric:tabular-nums}
.info .märk{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--dim2);font-weight:600;margin-bottom:3px}
.info .stöd{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1}
.info .stöd small{font-size:14px;font-weight:400;color:var(--dim)}
.info .kassa{text-align:right}
.info .kassa .tal{font-size:22px;font-weight:600;color:var(--guld);line-height:1}
.mål{font-size:12.5px;color:var(--dim);margin:14px 0 0;line-height:1.45}

/* Kortyta */
.yta{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;
  min-height:280px}
.kort{position:absolute;width:100%;max-width:360px;background:var(--kort);color:var(--ink);
  border-radius:18px;padding:26px 24px;box-shadow:0 18px 40px rgba(0,0,0,.45);
  cursor:grab;will-change:transform}
.kort.dra{cursor:grabbing;transition:none}
.kort.slapp{transition:transform .45s cubic-bezier(.2,.7,.3,1),opacity .45s}
.kort h2{font-size:20px;font-weight:600;line-height:1.35;letter-spacing:-.015em;margin:0}
.kort .dragtip{margin-top:24px;font-size:22px;line-height:1;color:#B6AF9E;
  display:flex;justify-content:space-between}

/* Valet visas först när man drar */
.valrad{min-height:132px;position:relative;display:flex;align-items:center;
  justify-content:center;flex:0 0 auto}
.efter{width:100%;transition:opacity .12s}
.efter.göm{opacity:0}
.efter .txt{font-size:14.5px;line-height:1.45;color:var(--kort)}
.efter .delta{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;
  font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.efter .delta b{font-weight:600;color:var(--pos)}
.efter .delta b.ned{color:var(--neg)}
.efter .varn{margin-top:9px;padding:8px 11px;background:#241C14;
  border-left:2px solid var(--guld);font-size:12.5px;color:#E8D6B4;border-radius:0 6px 6px 0}
.val{position:absolute;inset:0;display:flex;align-items:center}
.val{pointer-events:none;justify-content:center;opacity:0;transition:opacity .12s}
.val .bubbla{max-width:100%;background:var(--bg2);border:1px solid #333D4B;border-radius:12px;
  padding:12px 16px;text-align:center;transform:translateY(-6px);transition:transform .12s,border-color .15s,background .15s}
.val.på .bubbla{transform:translateY(0)}
.val.klar .bubbla{background:#22303A;border-color:var(--kort)}
.val .sida{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);
  font-weight:600;margin-bottom:4px}
.val .txt{font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.val .kr{font-size:12px;color:var(--guld);margin-top:4px;font-variant-numeric:tabular-nums}
.val .berör{margin-top:9px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.val .berör span{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;
  color:var(--dim);border:1px solid #3A4655;border-radius:99px;padding:2px 8px}
.val .berör span.upp{color:#7FBFA3;border-color:#3D5B4E}
.val .berör span.ned{color:#D98A82;border-color:#5E3E3B}
.val.klar .berör span.upp{color:#8FD3B4;border-color:#57A183}
.val.klar .berör span.ned{color:#E8A29A;border-color:#C4584F}
.val.klar .sida{color:var(--kort)}
.val .bedom{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2);
  margin-top:8px;font-weight:600}
.info .kassa .spurttips{font-size:10.5px;color:var(--dim2);margin-top:3px}

/* Vad mätarna gör — står på startskärmen så man vet vad man tittar på */
.roller{display:grid;gap:7px;margin:0 0 20px;padding:13px 15px;
  background:var(--bg2);border:1px solid #29313D;border-radius:12px}
.roller div{display:flex;gap:9px;align-items:baseline}
.roller b{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--guld);
  font-weight:600;flex:0 0 68px}
.roller span{font-size:12.5px;color:var(--dim);line-height:1.35}
.roller .fotnot{display:block;font-size:12px;color:var(--guld);line-height:1.4;
  border-top:1px solid #29313D;padding-top:9px;margin-top:2px}
.parti i.svårt{display:inline-block;font-style:normal;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;font-weight:600;margin-top:7px;padding:2px 8px;border-radius:99px;
  border:1px solid currentColor}
.parti i.s1{color:#7FBFA3} .parti i.s2{color:var(--dim)} .parti i.s3{color:#D98A82}

/* Facit: hela valrörelsen, beslut för beslut */
.facit{list-style:none;counter-reset:f;margin:16px 0 0;padding:0;
  max-height:min(46vh,340px);overflow-y:auto;-webkit-overflow-scrolling:touch;
  border-top:1px solid #DDD8CE}
.facit li{counter-increment:f;padding:10px 0 10px 30px;position:relative;
  border-bottom:1px solid #EDE9E0}
.facit li::before{content:counter(f);position:absolute;left:0;top:11px;font-size:11px;
  font-weight:600;color:#9A9282;font-variant-numeric:tabular-nums}
.facit b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8A8272}
.facit em{display:block;font-style:normal;font-size:14px;font-weight:600;margin-top:1px}
.facit .rad{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.facit i{font-style:normal;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.facit i.upp{color:#2F7D5E} .facit i.ned{color:#B24B41}
.facit u{display:block;text-decoration:none;font-size:11.5px;color:#B24B41;margin-top:4px;
  font-weight:600}



/* Följd */
.delta{display:flex;gap:14px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.delta span b{color:var(--pos);font-weight:600}
.delta span b.ned{color:var(--neg)}
.varning{margin:0 0 14px;padding:10px 12px;background:#241C14;border-left:2px solid var(--guld);
  font-size:13px;color:#E8D6B4;border-radius:0 6px 6px 0}

/* Start och slut */
.panel{position:relative;width:100%;max-width:360px;max-height:100%;overflow-y:auto;
  -webkit-overflow-scrolling:touch;padding:2px}
.panel h1{font-size:27px;font-weight:600;letter-spacing:-.03em;margin:0 0 4px}
.panel .under{color:var(--dim);font-size:14px;margin:0 0 22px}
.parti{display:block;width:100%;text-align:left;background:var(--bg2);color:var(--kort);
  border:1px solid #29313D;border-radius:12px;padding:13px 15px;margin-bottom:9px;
  font:inherit;cursor:pointer;transition:border-color .15s,transform .1s}
.parti:hover{border-color:#3E4A5A}
.parti:active{transform:scale(.985)}
.parti b{display:block;font-size:15.5px;font-weight:600}
.parti span{display:block;font-size:12.5px;color:var(--dim);margin-top:2px}
.parti em{display:block;font-size:12px;color:var(--guld);font-style:normal;margin-top:5px}
.parti u{display:block;font-size:12px;color:var(--dim2);text-decoration:none;margin-top:3px}
.slutkort{background:var(--kort);color:var(--ink);border-radius:18px;padding:26px 24px}
.slutkort .stor{font-size:38px;font-weight:600;letter-spacing:-.035em;line-height:1}
.slutkort .stor small{font-size:16px;color:var(--dim2)}
.dom{margin:18px 0;padding:14px 0;border-top:1px solid #DDD8CE;border-bottom:1px solid #DDD8CE}
.dom .rubrik{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);margin-bottom:5px}
.dom b{font-size:17px;font-weight:600}
.tabell{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:13.5px;
  font-variant-numeric:tabular-nums;color:#4A525E}
.tabell span:nth-child(even){font-weight:600;color:var(--ink);white-space:nowrap}
.tabell em{font-style:normal;font-weight:400;color:#8A8272;margin-left:6px;font-size:12px}
.knapp{width:100%;margin-top:20px;background:var(--ink);color:var(--kort);border:0;border-radius:10px;
  padding:13px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.knapp:active{transform:scale(.99)}
.hint{text-align:center;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim2);min-height:14px}
</style>
</head>
<body>
<div class="bakgrund"></div>
<div class="scen">
  <div id="hud"></div>
  <div class="valrad">
    <div class="efter" id="efter"></div>
    <div class="val" id="val"><div class="bubbla">
      <div class="sida" id="valSida"></div>
      <div class="txt" id="valTxt"></div>
      <div class="kr" id="valKr"></div>
      <div class="berör" id="valBerör"></div>
      <div class="bedom">Står på spel</div>
    </div></div>
  </div>
  <div class="yta" id="yta"></div>
  <div class="hint" id="hint"></div>
</div>

<script>
/* ============ DATA ============ */
const DRAG_ANTAL=18, SKALA=2.8, ÖVRE=82, UNDRE=18, SEN_FAKTOR=1.7;
/* Slutspurten: varje kvarvarande miljon köper annonser sista veckan.
   Genomslaget: mediebilden avgör hur mycket av det du gör som faktiskt når väljarna. */
const SPURT=0.18, GENOMSLAG_MIN=0.15, GENOMSLAG_SPANN=1.70, NYHETSCYKEL=0;
/* Dragbubblan säger vilka mätare som står på spel, aldrig åt vilket håll.
   Riktningen ska gå att läsa ur kortets text; det är hela beslutet.
   Sätt VISA_NAMN till false för att inte ens avslöja vilka mätare det gäller. */
const VISA_NAMN=true;

/* Varje mätare gör något eget. Väljarna är poängen; de tre andra avgör
   vad du kan göra, vad det kostar, och om någon tar dig på allvar. */
const SEG=[
  {id:"par",namn:"Partiet",  vikt:.3, roll:"Ett splittrat parti gör varje utspel dyrare. Räknas knappt på valdagen.",
   hög:"Partiet är enigt och helt inåtvänt. Omvärlden noterar det.",
   låg:"Ditt eget parti litar inte längre på dig. Allt kostar mer."},
  {id:"med",namn:"Media",    vikt:.08, roll:"Förstorar ditt väljarläge på valdagen — åt båda håll. Men klingar av.",
   hög:"Du är överallt. Varje nytt uttalande vägs mot allt du redan sagt.",
   låg:"Redaktionerna har tröttnat. Det du gör når inte ut."},
  {id:"blo",namn:"Blocket",  vikt:.3, roll:"Dina möjliga samarbetspartier. Belönar förutsägbarhet och institutionell försiktighet, straffar löften som binder dem. Vägs in på valdagen.",
   hög:"Du är en förutsägbar partner och betraktas som utbytbar.",
   låg:"Blocket räknar inte längre med dig i förhandlingarna."},
  {id:"val",namn:"Väljarna", vikt:.32, roll:"Siffran du mäts på — men bara så långt den syns.",
   hög:"Opinionen är med dig, vilket gör varje avsteg dyrare.",
   låg:"Väljarna har slutat lyssna på vad du säger."}];

const PARTIER=[
 {namn:"Det gamla partiet",rad:"Störst organisation. Krympande väljarbas.",svårt:1,
  press:{val:-1.13},pressrad:"Väljarna faller av sig själva. Du måste hålla emot.",
  bas:14.2,kassa:46,mal:"Behålla väljarstödet",prova:s=>s.total>=s.start},
 {namn:"Vågmästaren",rad:"Litet. Avgör vem som styr.",svårt:1,
  press:{med:-2.22,val:-1.9},pressrad:"Ett litet parti glöms bort mellan utspelen.",
  bas:4.2,kassa:42,mal:"Klara spärren på 4 procent",prova:s=>s.total>=4},
 {namn:"Enfrågepartiet",rad:"En fråga. En lojal skara.",svårt:2,
  press:{val:-1.9,med:-1.57},pressrad:"En fråga bär bara en bit på vägen.",
  bas:5.2,kassa:42,mal:"Klara spärren med profilen kvar",prova:s=>s.total>=5},
 {namn:"Regeringspartiet",rad:"Sitter vid makten. Har ett facit att försvara.",svårt:2,
  press:{val:-0.95,par:-0.61},pressrad:"Makten sliter, och allt du gör vägs mot facit.",
  bas:27.7,kassa:50,mal:"Vara största parti",prova:s=>s.total>=28},
 {namn:"Utmanaren",rad:"Största oppositionsparti. Behöver inte leverera.",svårt:3,
  press:{med:-0.86,blo:-0.93},pressrad:"Granskas som ett regeringsalternativ, behandlas som opposition.",
  bas:25,kassa:46,mal:"Bli största parti",prova:s=>s.total>=25.5},
 {namn:"Nykomlingen",rad:"Nystartat. Inget att förlora.",svårt:3,
  press:{par:-1.18},pressrad:"Ingen organisation. Partiet håller ihop bara så länge det går bra.",
  bas:3.9,kassa:46,mal:"Ta sig in i riksdagen",prova:s=>s.total>=4},
];
const SVÅRT=["","Lättare valrörelse","Jämn valrörelse","Tuff valrörelse"];

/* v = vänster (svep vänster), h = höger */
const DÄCK=[
 {e:"Vårändringsbudgeten",t:"Vårändringsbudgeten är valårets sista tillfälle att lägga pengar på bordet. Du får driva en post. Dina samarbetspartier har redan lovat skattesänkningen.",
  v:{txt:"Välfärdens kärna",kost:2,eff:{blo:-2.94,par:1.06,val:0.58},f:"Posten prissattes till nio miljarder. Effekten skulle synas om tre till fem år."},
  h:{txt:"Sänkt skatt på arbete",kost:2,eff:{blo:3.06,par:-1.04,val:-0.72},f:"Sänkningen skulle slå igenom i januari. Pensionärerna omfattas inte."}},

 {e:"Myndigheten",t:"En myndighet har överskridit sin budget med 1,2 miljarder. Du får frågan inom en timme.",
  v:{txt:"Begär en utredning",kost:1,eff:{med:-3.05,blo:1.16,par:0.76},f:"En utredning skulle redovisas i november. Valet är i september."},
  h:{txt:"Kräv avgång",kost:3,eff:{med:3.15,blo:-1.14,par:-0.94},f:"En anvisning till en myndighet vore ministerstyre och är förbjudet. Kravet upprepades ändå på torsdagen."}},

 {e:"Partiledardebatten",t:"Partiledardebatten är fyrtio minuter direktsänd, varav ungefär tjugo sekunder kommer att spridas.",
  v:{txt:"Bemöt sakligt",kost:2,eff:{med:-2.85,par:0.96,val:1.08},f:"Sakligheten uppmärksammades i en ledarartikel. Klippet spreds inte."},
  h:{txt:"Avbryt, håll hög ton",kost:1,eff:{med:3.35,par:-0.94,val:-1.22},f:"Klippet som spreds var när du suckade. Det såg sämre ut än det lät."}},

 {e:"Läckan",t:"Ett internt mejl har läckt. Innehållet är inte olagligt, bara pinsamt.",
  v:{txt:"Bekräfta och beklaga",kost:1,eff:{par:-3.24,med:-1.15,val:1.28},f:"Historien var död på fredagen."},
  h:{txt:"Ifrågasätt äktheten",kost:5,eff:{par:2.86,med:0.95,val:-1.62},f:"Äktheten bekräftades på onsdagen. Historien levde i nio dagar."}},

 {e:"Valaffischen",t:"Valaffischen ska tryckas. Motivet sitter uppe ända till valdagen.",
  v:{txt:"Ett löfte i stor text",kost:5,eff:{val:3.28,blo:-1.24,par:-0.74},f:"Löftet citerades i varje intervju därefter. Även efter valet."},
  h:{txt:"Porträtt och partinamn",kost:4,eff:{val:-3.12,blo:1.06,par:0.76},f:"Igenkänningen ökade. Ingen kunde återge vad du vill."}},

 {e:"Underhållningsprogrammet",t:"Du är inbjuden till ett program där du ska baka. Politik får inte diskuteras.",
  v:{txt:"Tacka nej",kost:1,eff:{val:-3.22,par:1.16,med:-0.65},f:"Platsen gick till en konkurrent. Avsnittet fick höga tittarsiffror."},
  h:{txt:"Tacka ja",kost:2,eff:{val:3.18,par:-1.14,med:0.65},f:"Du var folklig i 43 minuter. Ledarsidorna kallade det ett lågvattenmärke."}},

 {e:"Inlägget på X",t:"Ett klipp på dig sprids med vilseledande text. 40 000 visningar och stigande.",
  v:{txt:"Låt det ligga",kost:1,eff:{med:-2.95,val:0.88,par:0.56},f:"Klippet nådde 300 000 visningar och slutade sedan spridas av sig självt."},
  h:{txt:"Svara i tråden",kost:1,eff:{med:2.95,val:-1.02,par:-0.74},f:"Svaret fick fler visningar än klippet. Så gjorde även citaten av svaret."}},

 {e:"Interna kritiken",t:"Tre distriktsordförande har uttalat sig anonymt om ditt ledarskap.",
  v:{txt:"Kalla till möte",kost:2,eff:{par:3.26,med:-1.25},f:"Mötet läckte. Innehållet i läckan var att mötet varit konstruktivt."},
  h:{txt:"Markera offentligt",kost:1,eff:{par:-3.14,med:1.25},f:"Två av tre stannade. Den tredje skrev en debattartikel."}},

 {e:"Donationen",t:"En intresseorganisation erbjuder tolv miljoner till valrörelsen.",
  v:{txt:"Ta emot",kost:-12,eff:{med:-3.5,val:-2.4,par:1.39},f:"Bidraget redovisas enligt reglerna, längst ner på en sida ingen läser.",öppnar:1},

/* ============ TILLSTÅND ============ */
let S=null;
const yta=document.getElementById("yta"), hud=document.getElementById("hud"), hint=document.getElementById("hint");
const klamp=v=>Math.max(0,Math.min(100,v));
const faktor=l=>0.4+l*0.012;
const sen=()=>S.i>=Math.floor(DRAG_ANTAL*2/3);

/* Mediebilden förstorar hela ditt väljarläge på valdagen. Ligger du under
   femtio förstorar den lika villigt det. */
const genomslag=()=>GENOMSLAG_MIN+S.lean.med/100*GENOMSLAG_SPANN;
/* Ett splittrat parti gör allt dyrare: fler samtal, fler möten, fler brandkårsutryckningar. */
const enighet=()=>1+Math.max(0,50-S.lean.par)/70;
/* Blocket vägs in på valdagen: räknas du som ett regeringsalternativ? */
const blockstöd=l=>0.95+l.blo*0.001;
/* Kvarvarande kassa går till annonser sista veckan. */
const spurt=()=>Math.max(0,S.kassa)*SPURT;

const kostnad=v=>v.kost<=0?v.kost
  :Math.round(v.kost*(sen()?SEN_FAKTOR:1)*enighet()*10)/10;

const medGenomslag=l=>({...l,val:klamp(50+(l.val-50)*genomslag())});
const medSpurt=l=>({...l,val:klamp(l.val+spurt())});
function slutlean(){return medSpurt(medGenomslag(S.lean));}
function poäng(l){
  return S.parti.bas*Math.exp(
    SEG.reduce((a,s)=>a+s.vikt*Math.log(Math.max(0.05,faktor(l[s.id]))),0));
}
function totalt(slut){
  return slut?poäng(slutlean())*blockstöd(S.lean):poäng(S.lean);
}

// Vilka mätare som står på spel. Åt vilket håll de rör sig står inte här —
// det ska framgå av kortets text, och det är hela beslutet.
function berörda(kort,v,sida){
  return SEG.filter(s=>Math.abs(v.eff[s.id]||0)>=0.05)
            .map(s=>({seg:s,upp:(v.eff[s.id]||0)>0}));
}

function blanda(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[x[i],x[j]]=[x[j],x[i]];}return x;}

function nytt(parti){
  const start=DÄCK.filter(k=>!k.dold&&!k.sist&&k.e==="Vårändringsbudgeten");
  const sist=DÄCK.filter(k=>k.sist);
  const mitt=blanda(DÄCK.filter(k=>!k.dold&&!k.sist&&k.e!=="Vårändringsbudgeten"));
  const lean={};SEG.forEach(s=>lean[s.id]=50);
  S={parti,lean,kassa:parti.kassa,maxKassa:parti.kassa,historik:[],
     frö:Math.random().toString(36).slice(2),
     i:0,lek:start.concat(mitt.slice(0,DRAG_ANTAL-2),sist),start:parti.bas,slutOrsak:null,nödlån:false};
}

function utfall(v){
  const ut={};SEG.forEach(s=>ut[s.id]=(v.eff[s.id]||0)*SKALA);return ut;
}

function verkställ(v){
  S.kassa=Math.round((S.kassa-kostnad(v))*10)/10;
  S.nödlån=false;
  if(S.kassa<0){                                 // slut i kassan stoppar inte en valrörelse,
    S.lean.par=klamp(S.lean.par+S.kassa*0.8);    // det bara syns på partiet
    S.kassa=0;S.nödlån=true;
  }
  const ut=utfall(v);
  SEG.forEach(s=>S.lean[s.id]=klamp(S.lean[s.id]+ut[s.id]));
  const press=S.parti.press||{};                 // partiets egen motvind, varje kort
  for(const id in press) S.lean[id]=klamp(S.lean[id]+press[id]);
  S.lean.med+=(50-S.lean.med)*NYHETSCYKEL;       // nyhetscykeln: uppmärksamhet klingar av
  S.varning=null;
  const hög=SEG.find(s=>S.lean[s.id]>=ÖVRE), låg=SEG.find(s=>S.lean[s.id]<=UNDRE);
  if(hög){S.lean[hög.id]=klamp(S.lean[hög.id]-3);   // mjukt tak: överhettningen faller tillbaka
    SEG.forEach(s=>{if(s!==hög)S.lean[s.id]=klamp(S.lean[s.id]-1);});
    S.varning=hög.hög;}
  if(låg){S.lean[låg.id]=klamp(S.lean[låg.id]+1);   // botten studsar, ingen dödsspiral
    S.varning=låg.låg;}
  S.sistaUtfall=ut;
  if(v.öppnar!==undefined){
    // Gentjänsten ersätter ett kommande kort — valrörelsen blir inte längre,
    // den blir bara upptagen med något annat.
    const k=DÄCK.find(x=>x.dold);
    if(k&&!S.lek.includes(k)){const p=Math.min(S.lek.length-2,S.i+2+(Math.random()*3|0));S.lek.splice(p,1,k);}
  }
  if(S.nödlån)S.varning="Kassan är tom. Distrikten fick låna ut, och de kommer att påminna om det.";
}

/* ============ VYER ============ */
function ritaHud(){
  if(!S){hud.innerHTML="";return;}
  const g=SEG.map(s=>{
    const l=S.lean[s.id], d=l-50, fara=l>=ÖVRE-6||l<=UNDRE+6;
    const a=Math.min(l,50), b=Math.max(l,50);
    const riktn=d>1.5?"upp":d<-1.5?"ned":"";
    return `<div class="gauge ${fara?'fara':''}" id="g-${s.id}" title="${s.namn}: ${s.roll}">
      <div class="namn">${s.namn}</div>
      <div class="spår"><i class="${riktn}" style="left:${a}%;width:${Math.max(b-a,4)}%"></i><span class="mitt"></span></div>
      <div class="v ${riktn}">${d>0?"+":""}${d.toFixed(0)}</div></div>`;
  }).join("");
  hud.innerHTML=`<div class="topp">${g}</div>
    <div class="info">
      <div><div class="märk">Väljarstöd</div>
        <div class="stöd">${totalt().toFixed(1)}<small> %</small></div></div>
      <div class="kassa"><div class="märk">Partikassa</div>
        <div class="tal">${S.kassa.toFixed(1)} mkr</div>
        <div class="spurttips">räcker till +${spurt().toFixed(1)} hos väljarna</div></div></div>
    <p class="mål">${S.parti.mal}<br>Kort ${Math.min(S.i+1,S.lek.length)} av ${S.lek.length}</p>`;
}

function vyStart(){
  S=null;ritaHud();hint.textContent="";
  yta.innerHTML=`<div class="panel"><h1>Valåret</h1>
    <p class="under">Ett år. Arton beslut. Svep åt det håll du väljer.</p>
    <div class="roller">${SEG.map(s=>
      `<div><b>${s.namn}</b><span>${s.roll}</span></div>`).join("")}
      <div class="fotnot">När du drar ser du vilka mätare som står på spel — aldrig åt
      vilket håll. Det ska du läsa dig till ur kortet. Efteråt får du veta hur det gick.</div></div>
    <div id="lista"></div></div>`;
  const l=document.getElementById("lista");
  PARTIER.forEach(p=>{
    const b=document.createElement("button");b.className="parti";
    b.innerHTML=`<b>${p.namn}</b><span>${p.rad}</span>`+
      `<em>Mål: ${p.mal}</em><u>${p.pressrad}</u>`+
      `<i class="svårt s${p.svårt}">${SVÅRT[p.svårt]}</i>`;
    b.onclick=()=>{nytt(p);vyKort();};
    l.appendChild(b);
  });
}

function spelaRespons(f){
  const el=document.getElementById("efter");
  if(el){el.classList.add("ny");setTimeout(()=>el.classList.remove("ny"),400);}
  SEG.forEach(s=>{
    const d=f.ut[s.id]||0;
    if(!d) return;
    const g=document.getElementById("g-"+s.id);
    if(!g) return;
    g.classList.add("puls");
    setTimeout(()=>g.classList.remove("puls"),600);
    const sp=document.createElement("span");
    sp.className="flyt"+(d<0?" ned":"");
    sp.textContent=(d>0?"+":"")+d.toFixed(1);
    g.appendChild(sp);
    setTimeout(()=>sp.remove(),1200);
  });
}

function ritaEfter(){
  const el=document.getElementById("efter");
  if(!el) return;
  el.classList.remove("göm");
  const f=S.följd;
  if(!f){el.innerHTML="";return;}
  const d=SEG.map(s=>{const n=f.ut[s.id]||0;if(!n)return"";
    return `<span>${s.namn} <b class="${n<0?'ned':''}">${n>0?'+':''}${n.toFixed(1)}</b></span>`;}).join("");
  el.innerHTML=`<div class="txt">${f.text}</div><div class="delta">${d}</div>`+
    (f.varning?`<div class="varn">${f.varning}</div>`:"");
}

function vyKort(){
  ritaHud();
  hint.textContent="Dra kortet åt vänster eller höger";
  const k=S.lek[S.i];
  yta.innerHTML=`
    <div class="kort" id="kort">
      <h2>${k.t}</h2>
      <div class="dragtip"><span>&#8592;</span><span>&#8594;</span></div>
    </div>`;
  ritaEfter();
  if(S.följd && S.följd.ny){ spelaRespons(S.följd); S.följd.ny=false; }
  koppla(document.getElementById("kort"),k);
}

const prisTxt=v=>{const c=kostnad(v);return c<0?`+${Math.abs(c)} mkr`:`−${c} mkr`;};

function koppla(el,k){
  let x0=0,dx=0,drar=false;
  const val=document.getElementById("val");
  const vSida=document.getElementById("valSida"), vTxt=document.getElementById("valTxt"),
        vKr=document.getElementById("valKr"), vBer=document.getElementById("valBerör");
  const efter=document.getElementById("efter");
  const märk=lista=>SEG.forEach(s=>{
    const el=document.getElementById("g-"+s.id);
    if(el) el.classList.toggle("berörd", lista.some(b=>b.seg===s));
  });
  const TRÖSKEL=70, START=18;
  const flytta=()=>{
    const visa=Math.max(-150,Math.min(150,dx));
    el.style.transform=`translateX(${visa}px) rotate(${visa*0.055}deg)`;
    const a=Math.abs(dx);
    if(a<START){ val.style.opacity=0; val.classList.remove("på","klar"); efter.classList.remove("göm"); märk([]); return; }
    const v=dx<0?k.v:k.h;
    const ber=berörda(k,v,dx<0?"v":"h");
    vSida.textContent = dx<0 ? "Vänster" : "Höger";
    vTxt.textContent  = v.txt;
    vKr.textContent   = prisTxt(v);
    vBer.innerHTML    = VISA_NAMN
      ? ber.map(b=>`<span>${b.seg.namn}</span>`).join("") : "";
    efter.classList.add("göm");
    märk(ber);
    val.style.opacity = Math.min(1,(a-START)/(TRÖSKEL-START));
    val.classList.add("på");
    val.classList.toggle("klar", a>=TRÖSKEL);
  };
  const ner=e=>{drar=true;x0=(e.touches?e.touches[0].clientX:e.clientX);el.classList.add("dra");el.classList.remove("slapp");};
  const rör=e=>{if(!drar)return;e.preventDefault();
    dx=(e.touches?e.touches[0].clientX:e.clientX)-x0;flytta();};
  const välj=riktning=>{
    const valt=riktning<0?k.v:k.h;
    el.classList.remove("dra");el.classList.add("slapp");
    el.style.transform=`translateX(${riktning<0?-600:600}px) rotate(${riktning<0?-28:28}deg)`;
    el.style.opacity=0;
    märk([]);
    val.style.opacity=0; val.classList.remove("på","klar");   // bubblan släcks
    const kostade=kostnad(valt);
    verkställ(valt);
    S.historik.push({e:k.e,txt:valt.txt,sida:riktning<0?"Vänster":"Höger",
      ut:S.sistaUtfall,kost:kostade,f:valt.f});
    S.följd={text:valt.f, ut:S.sistaUtfall, varning:S.varning, ny:true};
    släpp();                                   // kortets lyssnare behövs inte längre
    setTimeout(()=>{
      S.i++;
      if(S.i>=S.lek.length) vySlut(); else vyKort();
    },300);
  };
  const upp=()=>{
    if(!drar)return;drar=false;el.classList.remove("dra");el.classList.add("slapp");
    if(Math.abs(dx)>TRÖSKEL) välj(dx);
    else{dx=0;el.style.transform="";val.style.opacity=0;val.classList.remove("på","klar");efter.classList.remove("göm");märk([]);}
  };
  const tangent=e=>{
    if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;
    e.preventDefault();
    if(drar){drar=false;}
    välj(e.key==="ArrowLeft"?-1:1);
  };
  // Allt som hängs på window plockas bort igen när kortet lämnar skärmen.
  function släpp(){
    window.removeEventListener("mousemove",rör);
    window.removeEventListener("mouseup",upp);
    window.removeEventListener("keydown",tangent);
  }
  el.addEventListener("mousedown",ner);
  window.addEventListener("mousemove",rör);
  window.addEventListener("mouseup",upp);
  window.addEventListener("keydown",tangent);
  el.addEventListener("touchstart",ner,{passive:true});
  el.addEventListener("touchmove",rör,{passive:false});
  el.addEventListener("touchend",upp);
}

function vySlut(){
  const vb=document.getElementById("val");
  if(vb){vb.style.opacity=0;vb.classList.remove("på","klar");}
  const t=totalt(true), vann=S.parti.prova({total:t,start:S.start});
  ritaHud();hint.textContent="";
  // Valdagen räknas i fyra led, så man ser var resultatet kom ifrån
  const tecken=x=>(x>=0?"+":"−")+Math.abs(x).toFixed(1);
  const eftMedia=medGenomslag(S.lean), eftSpurt=medSpurt(eftMedia);
  const a=poäng(S.lean), b=poäng(eftMedia), c=poäng(eftSpurt);
  const g=genomslag();
  const steg=(v,d)=>`${v.toFixed(1)} %<em>${tecken(d)}</em>`;
  const rader=[
    ["Ditt läge före valdagen",`${a.toFixed(1)} %`],
    [`Genomslag i media ×${g.toFixed(2)}`,steg(b,b-a)],
    [spurt()>0.05?`Slutspurt, ${S.kassa.toFixed(1)} mkr`:"Slutspurt, tom kassa",steg(c,c-b)],
    ["Blocket "+(S.lean.blo>=55?"räknar med dig":S.lean.blo<=45?"räknar inte med dig":"varken eller"),
      steg(t,t-c)],
  ].map(([x,y])=>`<span>${x}</span><span>${y}</span>`).join("");

  const facit=S.historik.map((h,i)=>{
    const d=SEG.map(s=>{const n=h.ut[s.id]||0;if(Math.abs(n)<0.05)return"";
      return `<i class="${n<0?'ned':'upp'}">${s.namn.slice(0,3)} ${n>0?'+':''}${n.toFixed(1)}</i>`;}).join("");
    return `<li><b>${h.e}</b><em>${h.txt}</em><div class="rad">${d}</div></li>`;
  }).join("");

  yta.innerHTML=`<div class="panel"><div class="slutkort">
    <div class="etikett" style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8A93A0;margin-bottom:10px">
      Valresultat</div>
    <div class="stor">${t.toFixed(1)}<small> %</small></div>
    ${S.följd?`<div style="font-size:14px;color:#4A525E;margin-bottom:14px">${S.följd.text}</div>`:""}
    <div class="dom"><div class="rubrik">${S.parti.namn}</div>
      <b>${vann?"Målet uppnått":"Målet ej uppnått"}</b>
      <div style="font-size:13.5px;color:#4A525E;margin-top:6px">${S.parti.mal}. Utgångsläge ${S.start.toFixed(1)} %.</div></div>
    <div class="tabell">${rader}</div>
    <button class="knapp" id="visa">Visa valrörelsen beslut för beslut</button>
    <ol class="facit" id="facit" hidden>${facit}</ol>
    <button class="knapp" id="om">Spela igen som annat parti</button>
  </div></div>`;
  const f=document.getElementById("facit"), vknapp=document.getElementById("visa");
  vknapp.onclick=()=>{f.hidden=!f.hidden;
    vknapp.textContent=f.hidden?"Visa valrörelsen beslut för beslut":"Dölj besluten";};
  document.getElementById("om").onclick=vyStart;
}

vyStart();
</script>
